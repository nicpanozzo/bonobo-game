    <path d="M98 44 L104 50 M104 44 L98 50 M112 50 L118 56 M118 50 L112 56 M128 44 L134 50 M134 44 L128 50 M140 50 L146 56 M146 50 L140 56" fill="none" stroke="#7d848f" stroke-width="2.2"/>
