    <path d="M180 59 L186 62.5 L186 69.5 L180 73 L174 69.5 L174 62.5 Z" fill="#8a919b" stroke-width="2.2"/>
    <path d="M200 40 L203 46 M200 92 L203 98" fill="none" stroke-width="2"/>
