    <rect x="74" y="28" width="86" height="80" rx="14" fill="#c9ced5"/>
    <path d="M76 76 L158 76 L158 94 Q158 108 144 108 L88 108 Q74 108 74 94 Z" fill="#949ba5" stroke="none"/>
