    <rect x="152" y="14" width="56" height="108" rx="22" fill="#d3d7dd"/>
    <path d="M154 72 L206 72 L206 100 Q206 122 184 122 L174 122 Q152 122 152 100 Z" fill="#9ca3ad" stroke="none"/>
