<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 121" width="176" height="121">
  <!-- Pistola v2: corpo verde petrolio più chiaro, cella ambra accesa, canna con alette, calcio di legno a scacchi -->
  <g stroke="#1b1a22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- il calcio di legno inclinato, con la zigrinatura e la vite d'ottone -->
    <path d="M46 56 L78 56 L72 112 Q70 118 64 118 L42 118 Q36 118 37 112 Z" fill="#94603a"/>
    <path d="M63 56 L78 56 L72 112 Q70 118 64 118 Z" fill="#6f4529" stroke="none"/>
    <path d="M46 56 L78 56 L72 112 Q70 118 64 118 L42 118 Q36 118 37 112 Z" fill="none"/>
    <!-- il pannello zigrinato, a rombi regolari dentro una guancia più chiara -->
    <clipPath id="guancia"><path d="M50 64 L72 64 L67 104 L45 104 Z"/></clipPath>
    <path d="M50 64 L72 64 L67 104 L45 104 Z" fill="#a8744a" stroke-width="2.5"/>
    <g clip-path="url(#guancia)" stroke="#5c3a20" stroke-width="1.6" fill="none">
      <path d="M30 64 L80 114 M38 64 L88 114 M46 64 L96 114 M54 64 L104 114 M22 64 L72 114 M14 64 L64 114 M6 64 L56 114"/>
      <path d="M90 64 L40 114 M82 64 L32 114 M74 64 L24 114 M66 64 L16 114 M98 64 L48 114 M106 64 L56 114 M114 64 L64 114"/>
    </g>
    <circle cx="58.5" cy="84" r="3.5" fill="#d9b04e" stroke-width="2"/>
    <rect x="38" y="112" width="34" height="7" rx="2" fill="#5b6270"/>
    <!-- il ponticello e il grilletto -->
    <path d="M80 58 Q80 86 98 86 L106 86 L106 58" fill="none"/>
    <path d="M90 58 Q88 68 94 75" fill="none" stroke-width="3.5"/>
    <!-- il corpo: più chiaro di prima per leggersi sulle arene scure -->
    <path d="M30 22 L120 22 L120 60 L38 60 Q30 60 30 52 Z" fill="#5c9aa4"/>
    <path d="M30 44 L120 44 L120 60 L38 60 Q30 60 30 52 Z" fill="#41737c" stroke="none"/>
    <path d="M30 22 L120 22 L120 60 L38 60 Q30 60 30 52 Z" fill="none"/>
    <!-- il carrello sopra, con la zigrinatura dietro e il riflesso piatto -->
    <rect x="34" y="16" width="86" height="10" rx="3" fill="#7fb6bf"/>
    <path d="M40 18 L40 24 M45 18 L45 24 M50 18 L50 24" fill="none" stroke-width="2"/>
    <path d="M58 19 L114 19" fill="none" stroke="#d6f0f3" stroke-width="2.5"/>
    <!-- il cane dietro, il mirino davanti e la tacca dietro -->
    <path d="M30 26 L18 16 L22 36 Z" fill="#d9b04e"/>
    <rect x="108" y="8" width="8" height="9" rx="1.5" fill="#d9b04e"/>
    <rect x="36" y="10" width="7" height="7" rx="1.5" fill="#5b6270"/>
    <!-- la cella d'energia ambra, accesa, con le tacche di carica -->
    <rect x="48" y="29" width="40" height="12" rx="4" fill="#ffc24a"/>
    <path d="M58 31 L58 39 M68 31 L68 39 M78 31 L78 39" fill="none" stroke="#c98a1a" stroke-width="2.5"/>
    <path d="M52 32 L54 32" fill="none" stroke="#fff2c8" stroke-width="2.5"/>
    <!-- i rivetti del fianco -->
    <g fill="#2f545b" stroke-width="1.8"><circle cx="96" cy="32" r="3"/><circle cx="108" cy="32" r="3"/><circle cx="102" cy="50" r="3"/></g>
    <!-- la canna con le alette di raffreddamento -->
    <rect x="118" y="26" width="44" height="24" rx="4" fill="#a6afb9"/>
    <rect x="118" y="39" width="44" height="11" fill="#7a8490" stroke="none"/>
    <rect x="118" y="26" width="44" height="24" rx="4" fill="none"/>
    <rect x="124" y="23" width="5" height="30" rx="2" fill="#5b6270" stroke-width="3"/>
    <rect x="134" y="23" width="5" height="30" rx="2" fill="#5b6270" stroke-width="3"/>
    <rect x="144" y="23" width="5" height="30" rx="2" fill="#5b6270" stroke-width="3"/>
    <!-- la bocca d'ottone -->
    <rect x="160" y="24" width="12" height="28" rx="3" fill="#d9b04e"/>
    <path d="M160 31 L172 31" fill="none" stroke="#a5822c" stroke-width="2"/>
    <circle cx="166" cy="40" r="4.5" fill="#1b1a22" stroke="none"/>
  </g>
</svg>
