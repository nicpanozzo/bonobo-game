<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 366" width="124" height="366">
  <!-- Lancia di pietra v2: punta sfaccettata con incisioni, fascia rossa allacciata, zanne con la punta scura,
       perline, piume a strisce, asta con le venature, fasce di cuoio cucite e puntale -->
  <g stroke="#1b1a22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- l'asta di legno con il tratto a spirale e le venature -->
    <rect x="55" y="118" width="14" height="230" rx="5" fill="#8f6d46"/>
    <g stroke="none" fill="#6a4e31">
      <path d="M55 142 L69 128 L69 139 L55 153 Z"/><path d="M55 178 L69 164 L69 175 L55 189 Z"/>
      <path d="M55 214 L69 200 L69 211 L55 225 Z"/><path d="M55 250 L69 236 L69 247 L55 261 Z"/>
      <path d="M55 286 L69 272 L69 283 L55 297 Z"/>
    </g>
    <path d="M59 156 L59 170 M65 194 L65 206 M59 230 L59 244 M65 266 L65 278" fill="none" stroke="#b8946a" stroke-width="2"/>
    <rect x="55" y="118" width="14" height="230" rx="5" fill="none"/>
    <!-- le fasce di cuoio con le cuciture -->
    <rect x="52" y="300" width="20" height="10" rx="2" fill="#4d3b2b"/>
    <rect x="52" y="316" width="20" height="10" rx="2" fill="#4d3b2b"/>
    <path d="M57 302 L57 308 M62 302 L62 308 M67 302 L67 308 M57 318 L57 324 M62 318 L62 324 M67 318 L67 324" fill="none" stroke="#c9a37a" stroke-width="1.6"/>
