<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona dell'app: tre bonobo, quello davanti più grande (disegnata a mano, licenza del progetto) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf5a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <g id="face">
      <!-- orecchie -->
      <circle cx="-88" cy="6" r="26" fill="#3b2418"/>
      <circle cx="88" cy="6" r="26" fill="#3b2418"/>
      <circle cx="-88" cy="6" r="13" fill="#e9a98a"/>
      <circle cx="88" cy="6" r="13" fill="#e9a98a"/>
      <!-- testa con la riga in mezzo dei bonobo -->
      <circle cx="0" cy="0" r="86" fill="#3b2418"/>
      <path d="M-44 -74 Q-20 -96 0 -70 Q20 -96 44 -74 Q20 -84 0 -58 Q-20 -84 -44 -74 Z" fill="#2a170f"/>
      <!-- maschera del muso -->
      <path d="M0 -26 C-18 -52 -66 -48 -66 -10 C-66 18 -52 34 -48 46 C-40 74 -18 80 0 80 C18 80 40 74 48 46 C52 34 66 18 66 -10 C66 -48 18 -52 0 -26 Z" fill="#f2c19c"/>
      <ellipse cx="0" cy="44" rx="40" ry="30" fill="#f8d5b6"/>
      <!-- occhi -->
      <ellipse cx="-28" cy="-6" rx="14" ry="17" fill="#1b0f0a"/>
      <ellipse cx="28" cy="-6" rx="14" ry="17" fill="#1b0f0a"/>
      <circle cx="-23" cy="-12" r="5.5" fill="#fff"/>
      <circle cx="33" cy="-12" r="5.5" fill="#fff"/>
      <circle cx="-31" cy="0" r="2.5" fill="#fff"/>
      <circle cx="25" cy="0" r="2.5" fill="#fff"/>
      <!-- guance -->
      <ellipse cx="-46" cy="24" rx="11" ry="7" fill="#ff8f8f" opacity="0.75"/>
      <ellipse cx="46" cy="24" rx="11" ry="7" fill="#ff8f8f" opacity="0.75"/>
      <!-- naso e sorriso -->
      <ellipse cx="-7" cy="28" rx="4" ry="3" fill="#6b3a26"/>
      <ellipse cx="7" cy="28" rx="4" ry="3" fill="#6b3a26"/>
      <path d="M-22 46 Q0 66 22 46" fill="none" stroke="#6b3a26" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="190" fill="#fff3c4" opacity="0.35"/>
  <!-- i due dietro, inclinati verso l'esterno -->
  <g transform="translate(130 230) rotate(-10) scale(0.82)">
    <use href="#face"/>
  </g>
  <g transform="translate(382 230) rotate(10) scale(0.82)">
    <use href="#face"/>
  </g>
  <!-- bordo che stacca quello davanti, come nel pittogramma -->
  <g transform="translate(256 300) scale(1.08)">
    <circle cx="0" cy="0" r="96" fill="#ffb24a"/>
    <circle cx="-88" cy="6" r="36" fill="#ffb24a"/>
    <circle cx="88" cy="6" r="36" fill="#ffb24a"/>
    <use href="#face"/>
  </g>
</svg>
