# Esporta il gioco Godot per Windows, Mac e Linux e lo pubblica come Release su GitHub,
# a ogni merge su main che tocca godot/ o il server. I link "latest" puntano sempre all'ultima versione:
# https://github.com/nicpanozzo/bonobo-game/releases/latest/download/bonobo-game-windows.zip
# Nella stessa Release c'è il server per ospitare una serata con un doppio clic (#78):
# https://github.com/nicpanozzo/bonobo-game/releases/latest/download/bonobo-server-windows.zip
# E il gioco senza motore con la sua versione, per l'app che si aggiorna da sola (#115):
# https://github.com/nicpanozzo/bonobo-game/releases/latest/download/bonobo-game-version.json
name: App

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'src/server/**'
      - 'src/shared/**'
      - 'scripts/build-server.mjs'
      - 'package-lock.json'
      - '.github/workflows/app.yml'
  # Sulle PR che toccano il server si prova solo a costruirlo, senza pubblicare niente
  pull_request:
    paths:
      - 'src/server/**'
      - 'scripts/build-server.mjs'
      - 'package-lock.json'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.1

jobs:
  # Il server in un eseguibile solo (scripts/build-server.mjs), con accanto cloudflared per il tunnel.
  # Il Mac si costruisce su un Mac perché l'eseguibile va firmato (ad hoc) dopo averlo modificato.
  server:
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            node: linux-x64
            cloudflared: cloudflared-linux-amd64
          - name: windows
            os: ubuntu-latest
            node: win-x64
            cloudflared: cloudflared-windows-amd64.exe
          - name: mac
            os: macos-latest
            node: darwin-arm64
            cloudflared: cloudflared-darwin-arm64.tgz
          - name: mac-intel
            os: macos-latest
            node: darwin-x64
            cloudflared: cloudflared-darwin-amd64.tgz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scarica node e cloudflared per ${{ matrix.name }}
        run: |
          mkdir -p dl pacco
          V=$(node -v)
          CF=https://github.com/cloudflare/cloudflared/releases/latest/download/${{ matrix.cloudflared }}
          if [ "${{ matrix.node }}" = win-x64 ]; then
            curl -sSL -o dl/node https://nodejs.org/dist/$V/win-x64/node.exe
            curl -sSL -o pacco/cloudflared.exe $CF
          else
            curl -sSL https://nodejs.org/dist/$V/node-$V-${{ matrix.node }}.tar.gz | tar -xz -C dl --strip-components=2 node-$V-${{ matrix.node }}/bin/node
            case "${{ matrix.cloudflared }}" in
              *.tgz) curl -sSL $CF | tar -xz -C pacco cloudflared ;;
              *) curl -sSL -o pacco/cloudflared $CF ;;
            esac
            chmod +x pacco/cloudflared
          fi
      - name: Costruisce il server
        run: |
          case "${{ matrix.name }}" in
            windows) TARGET=win; OUT=pacco/bonobo-server.exe ;;
            mac*) TARGET=mac; OUT=pacco/bonobo-server ;;
            *) TARGET=linux; OUT=pacco/bonobo-server ;;
          esac
          node scripts/build-server.mjs --target $TARGET --node dl/node --out $OUT
          cat > pacco/LEGGIMI.txt <<'EOF'
          Server di Bonobo Game: ospita una serata con un doppio clic.

          1. Apri bonobo-server (su Windows bonobo-server.exe). Lascia cloudflared accanto, serve per il tunnel.
          2. Dopo qualche secondo il link della serata è copiato: incollalo sul Discord.
          3. Si apre il gioco nel browser: entra anche tu. Chi ha l'app incolla il link nel campo Server.
          4. Lascia aperta la finestra finché giocate: chiuderla spegne la serata.

          Istruzioni con le immagini: https://nicpanozzo.github.io/bonobo-game/#ospita
          EOF
          ls -la pacco
      - name: Prova che l'eseguibile parte (solo dove può girare)
        if: matrix.name == 'linux' || matrix.name == 'mac'
        run: |
          ./pacco/bonobo-server > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 20); do curl -sf http://localhost:3000/health && break; sleep 1; done
          curl -sf http://localhost:3000/health
          # Il tunnel vero, solo come controllo: se Cloudflare oggi non risponde la Release esce lo stesso
          URL=""
          for i in $(seq 1 30); do URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' server.log | head -1 || true); [ -n "$URL" ] && break; sleep 1; done
          for i in $(seq 1 30); do [ -n "$URL" ] && curl -sf --doh-url https://1.1.1.1/dns-query "$URL/health" && echo " <- dal tunnel $URL" && break; sleep 2; done || true
          kill $PID || true
          cat server.log
      - run: (cd pacco && zip -qry ../bonobo-server-${{ matrix.name }}.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: bonobo-server-${{ matrix.name }}
          path: bonobo-server-${{ matrix.name }}.zip

  pubblica:
    needs: server
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Godot e i modelli di esportazione per desktop si scaricano una volta e restano in cache
      - id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-desktop
      - if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p ~/godot $T
          curl -sSL -o /tmp/godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -oq /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -joq /tmp/templates.tpz 'templates/version.txt' 'templates/windows_release_x86_64.exe' 'templates/linux_release.x86_64' 'templates/macos.zip' -d $T
          rm /tmp/templates.tpz
      # La versione finisce dentro il gioco (#115): l'app la confronta con bonobo-game-version.json
      # della Release per sapere se aggiornarsi. Il file si scrive solo qui, non sta nel repository.
      - name: Scrive la versione nel gioco
        run: |
          printf '{"version": %s, "godot": "%s", "commit": "%s"}\n' "${{ github.run_number }}" "$GODOT_VERSION" "${GITHUB_SHA::7}" > godot/data/build.json
          cat godot/data/build.json
      - name: Esporta per Windows, Mac e Linux
        run: |
          mkdir -p godot/build/windows godot/build/macos godot/build/linux out
          ~/godot/godot --headless --path godot --import
          ~/godot/godot --headless --path godot --export-release Windows build/windows/bonobo-game.exe
          ~/godot/godot --headless --path godot --export-release macOS build/macos/bonobo-game.zip
          ~/godot/godot --headless --path godot --export-release Linux build/linux/bonobo-game.x86_64
          (cd godot/build/windows && zip -q ../../../out/bonobo-game-windows.zip bonobo-game.exe)
          cp godot/build/macos/bonobo-game.zip out/bonobo-game-mac.zip
          (cd godot/build/linux && chmod +x bonobo-game.x86_64 && zip -q ../../../out/bonobo-game-linux.zip bonobo-game.x86_64)
          ls -la out
      # Il gioco senza motore (#115): l'app scarica questo pacchetto per aggiornarsi senza riscaricare tutto.
      # Le immagini sono senza compressione per la GPU, quindi lo stesso .pck vale per Windows, Mac e Linux.
      - name: Esporta il pacchetto del gioco e la sua versione
        run: |
          ~/godot/godot --headless --path godot --export-pack Linux build/bonobo-game.pck
          cp godot/build/bonobo-game.pck out/
          SIZE=$(stat -c %s out/bonobo-game.pck)
          printf '{"version": %s, "godot": "%s", "size": %s}\n' "${{ github.run_number }}" "$GODOT_VERSION" "$SIZE" > out/bonobo-game-version.json
          cat out/bonobo-game-version.json
      - uses: actions/download-artifact@v4
        with:
          pattern: bonobo-server-*
          path: out
          merge-multiple: true
      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=app-${{ github.run_number }}
          cat > /tmp/note.md <<'EOF'
          Il gioco da scaricare. Apri l'app, scrivi il nome, incolla nel campo **Server** il link della serata che gira sul Discord e premi **Gioca**.

          - **Windows:** scompatta lo zip e apri `bonobo-game.exe`. Se Windows dice "PC protetto", clicca "Ulteriori informazioni" e poi "Esegui comunque".
          - **Mac:** scompatta lo zip e apri **Bonobo Game**. La prima volta il Mac la blocca perché non è firmata da Apple: vai in Impostazioni di Sistema → Privacy e sicurezza → "Apri comunque" (sui Mac più vecchi basta tasto destro → Apri). Se dice che è danneggiata, nel Terminale: `xattr -cr ~/Downloads/"Bonobo Game.app"`.
          - **Linux:** scompatta lo zip e apri `bonobo-game.x86_64`.

          Senza installare niente si gioca anche dal browser: https://nicpanozzo.github.io/bonobo-game/godot/

          **Per ospitare una serata** scarica `bonobo-server` per il tuo sistema (`mac` per i Mac con chip Apple, `mac-intel` per quelli più vecchi), scompatta e apri `bonobo-server`: dopo qualche secondo il link della serata è già copiato, incollalo sul Discord. Lascia aperta la finestra finché giocate.

          Tutto spiegato passo per passo: https://nicpanozzo.github.io/bonobo-game/#gioca
          EOF
          gh release create "$TAG" out/*.zip out/bonobo-game.pck out/bonobo-game-version.json --target "$GITHUB_SHA" --title "Bonobo Game ($TAG)" --notes-file /tmp/note.md --latest
