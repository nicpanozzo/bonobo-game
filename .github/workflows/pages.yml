# Pubblica il sito del progetto (cartella site/) su GitHub Pages quando cambia su main.
# Insieme al sito pubblica il client Godot esportato per il web, in /godot/ (#59).
# Pubblica anche le anteprime delle PR (branch "anteprime", vedi anteprima.yml) in /pr/<numero>/.
# Va attivato una volta sola: Settings → Pages → Source: GitHub Actions.
name: Sito

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'godot/**'
      - '.github/workflows/pages.yml'
  # Quando cambia un'anteprima. workflow_run gira su main, quindi può pubblicare su Pages
  workflow_run:
    workflows: [Anteprime]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Godot e il suo modello di esportazione web si scaricano una volta e restano in cache
      - id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web
      - if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSL -o /tmp/godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -oq /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -joq /tmp/templates.tpz 'templates/web_nothreads_release.zip' 'templates/version.txt' -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Esporta il client Godot in site/godot
        run: |
          mkdir -p site/godot
          ~/godot/godot --headless --path godot --import
          ~/godot/godot --headless --path godot --export-release Web ../site/godot/index.html
          test -f site/godot/index.wasm
      - name: Aggiunge le anteprime delle PR in site/pr
        run: |
          if git clone -q --depth 1 --branch anteprime "https://github.com/${{ github.repository }}.git" /tmp/anteprime 2>/dev/null && [ -d /tmp/anteprime/pr ]; then
            shopt -s nullglob
            cp -r /tmp/anteprime/pr site/pr
            # Il motore è lo stesso per tutte: si copia quello appena esportato
            for d in site/pr/*/; do cp site/godot/index.wasm "$d"; done
            ls site/pr
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
