# Arbitro automatico: ogni PR e ogni push su main devono passare typecheck e build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # i test usano i pattern di `node --test`, da Node 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # I test arrivano con #26; finché lo script non esiste il passo non fa niente
      - run: npm run test --if-present
      # godot/data/game.json è generato dai dati del gioco: deve restare allineato (#59)
      - run: npm run export:godot && git diff --exit-code godot/data
