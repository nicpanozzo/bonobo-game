# Arbitro automatico: ogni PR e ogni push su main devono passare typecheck, test, build e il caricamento del client Godot.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # i test usano i pattern di `node --test`, da Node 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # I test arrivano con #26; finché lo script non esiste il passo non fa niente
      - run: npm run test --if-present
      # godot/data/game.json è generato dai dati del gioco: deve restare allineato (#59)
      - run: npm run export:godot && git diff --exit-code godot/data
      # Budget di prestazioni del server (#83, PERF_BUDGET in constants.ts): i numeri finiscono nel riassunto del job
      - run: npm run bench -- --check

  # Il client Godot è il gioco ufficiale: i suoi script devono caricarsi senza errori
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-editor
      - if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -oq /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Carica il progetto e gli script
        run: |
          ~/godot/godot --headless --path godot --import 2>&1 | tee /tmp/import.log
          ~/godot/godot --headless --path godot --quit-after 60 2>&1 | tee /tmp/run.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/import.log /tmp/run.log
      # Test degli script del client (godot/tests, #83): un test che fallisce fa uscire con 1
      - name: Test del client
        run: ~/godot/godot --headless --path godot --script res://tests/run_tests.gd
      # Budget di prestazioni del client (#83): costo degli script per frame, migliore di 3 giri
      - name: Prestazioni del client
        run: ~/godot/godot --headless --path godot --script res://tools/bench_client.gd -- --check
      # Screenshot di lobby e partita finta (#83): si scaricano dalla pagina della CI; rosso se uno è tutto di un colore
      - name: Screenshot
        run: |
          command -v xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path godot --script res://tools/screenshot.gd -- --out=$RUNNER_TEMP/screenshot
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: ${{ runner.temp }}/screenshot
          if-no-files-found: ignore
          retention-days: 14
